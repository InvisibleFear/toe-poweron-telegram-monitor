name: Poweron Monitor
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'   # Автозапуск кожні 10 хвилин
  workflow_dispatch:         # Можливість ручного запуску
permissions:
  contents: write            # Дозвіл на збереження state.json
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests tzdata
        
      - name: Run monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
          TG_ADDRESS: ${{ secrets.TG_ADDRESS }}   # <-- ДОДАНО ЦЕЙ РЯДОК
        run: python main.py
        
      - name: Save state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
